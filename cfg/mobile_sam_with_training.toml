# Model architecture
model = "vit_t"

# Training dataset
dataset = "tests/tiles"

# Simulation runtime in seconds
simulation_time = 20 #100.0

# Learning rate
#learning_rate = 1e-4
lr = 1e-4

# Dataloaders threads
num_workers = 1

# Bit-rate distortion parameter
lmbda = 1e-2

# Batch size
batch_size = 16

# Test batch size
test_batch_size = 64

# Auxiliary loss learning rate
#aux_learning_rate = 1e-3
aux_lr = 1e-3

# Size of the patches to be cropped
patch_size = [256, 256]

# Use cuda
cuda = true

# Save model to disk
save = true

# Set random seed for reproducibility
seed = 42

# Path to a checkpoint
checkpoint = ""

# Time needed for communications in seconds
time_for_comms = 60.0

# estimated time per batch in seconds
time_per_batch = 1.0

# Save all the models over time
save_checkpoints_over_time = true

# Quality value for the model, 1 to 8
model_quality = 1

# Whether to use raw data
use_raw_data = false