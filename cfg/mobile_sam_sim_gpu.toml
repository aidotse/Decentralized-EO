# Model architecture
model = "vit_t"

# Training dataset
dataset = "tests/tiles"

# Simulation runtime in seconds
simulation_time = 604800

# Learning rate
#learning_rate = 1e-4
lr = 1e-5

# Dataloaders threads
num_workers = 1

# Bit-rate distortion parameter
lmbda = 1e-2

# Batch size
batch_size = 16

# Test batch size
test_batch_size = 64

# Auxiliary loss learning rate
#aux_learning_rate = 1e-3
aux_lr = 1e-5

# Size of the patches to be cropped
patch_size = [256, 256]

# Use cuda
cuda = true

# Save model to disk
save = true

# Set random seed for reproducibility
seed = 46

# Path to a checkpoint
checkpoint = ""

# Time needed for communications in seconds
time_for_comms = 3.88

# estimated time per batch in seconds
time_per_batch = 8.532207639593826

# Save all the models over time
save_checkpoints_over_time = true

# Quality value for the model, 1 to 8
model_quality = 1

# Whether to use raw data
use_raw_data = false

# Gradient clipping max norm
clip_max_norm = 1.0

# Training data files
train_data_files = ["split_1_train_data_RGB.pkl", "split_2_train_data_RGB.pkl", "split_3_train_data_RGB.pkl", "split_4_train_data_RGB.pkl", "split_5_train_data_RGB.pkl", "split_6_train_data_RGB.pkl", "split_7_train_data_RGB.pkl", "split_8_train_data_RGB.pkl"] 
#train_data_files = ["split_1_train_data_NDWI.pkl", "split_2_train_data_NDWI.pkl", "split_3_train_data_NDWI.pkl", "split_4_train_data_NDWI.pkl", "split_5_train_data_NDWI.pkl", "split_6_train_data_NDWI.pkl", "split_7_train_data_NDWI.pkl", "split_8_train_data_NDWI.pkl"]

# Evaluation data files
test_data_files = ["val_data_RGB.pkl"]
#test_data_files = ["val_data_NDWI.pkl"]